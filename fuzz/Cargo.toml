[package]
name = "voicechat_crypto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
voicechat_crypto = { path = "..", features = ["std", "hybrid"] }
libfuzzer-sys = { version = "0.4", optional = true }

[features]
default = []
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "host_runner"
path = "host_runner.rs"
doc = false
test = false

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"
doc = false
required-features = ["libfuzzer"]

[[bin]]
name = "header_decode"
path = "fuzz_targets/header_decode.rs"
doc = false
required-features = ["libfuzzer"]

[[bin]]
name = "triple_header_decode"
path = "fuzz_targets/triple_header_decode.rs"
doc = false
required-features = ["libfuzzer"]
