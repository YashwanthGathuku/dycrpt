name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
      - name: Verify locked Rust workspace
        run: bash scripts/verify.sh
      - name: Record successful core verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core-evidence
          python3 - <<'PY'
          import json, os, subprocess
          commit=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          expected=os.environ['GITHUB_SHA']
          if commit != expected:
              raise SystemExit(f'checkout SHA mismatch {commit} != {expected}')
          evidence={
              'schema':'dycrpt-core-verification-v1',
              'commit':commit,
              'rust':'1.85.0',
              'locked_dependencies':True,
              'fmt':True,
              'cargo_check_all_targets_all_features':True,
              'clippy_deny_warnings':True,
              'debug_tests_all_targets_all_features':True,
              'release_tests_all_targets_all_features':True,
              'pqxdh_10000_randomized':True,
              'bounded_fuzz_host':True,
              'passed':True,
          }
          with open('core-evidence/summary.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,sort_keys=True,indent=2); f.write('\n')
          PY
          rustc --version --verbose > core-evidence/rustc.txt
          cargo --version > core-evidence/cargo.txt
          sha256sum Cargo.lock > core-evidence/cargo-lock-sha256.txt
      - name: Upload core verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: core-verification-${{ github.sha }}
          path: core-evidence/
          if-no-files-found: error
          retention-days: 90

  opk-allocator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/voicechat_ci
      DYCRPT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PostgreSQL client and psycopg
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3-pip
          python3 -m pip install --break-system-packages --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Start isolated PostgreSQL with release-scale connection budget
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dycrpt-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=voicechat_ci \
            -p 5432:5432 \
            postgres:16 -c max_connections=300
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -U postgres -d voicechat_ci; then
              exit 0
            fi
            sleep 1
          done
          docker logs dycrpt-postgres
          exit 1
      - name: Install allocator schema and release-scale fixtures
        run: |
          PGPASSWORD=postgres psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/postgres/001_opk_allocator.sql
          PGPASSWORD=postgres psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/postgres/002_rollback_anchor.sql
          PGPASSWORD=postgres psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/postgres/ci_seed.sql
      - name: Stress 10k atomic OPK allocations with 128 concurrent clients
        run: |
          mkdir -p opk-evidence
          python3 server/postgres/stress_opk_allocator.py \
            --device-hex 6465766963652d6369 \
            --requests 10000 \
            --workers 128 \
            --require-one-time-pq \
            --commit "$GITHUB_SHA" \
            --json-out opk-evidence/summary.json
      - name: Capture database and schema evidence
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql "$DATABASE_URL" -Atc 'SHOW server_version;' > opk-evidence/postgres-version.txt
          sha256sum server/postgres/001_opk_allocator.sql server/postgres/002_rollback_anchor.sql \
            > opk-evidence/schema-sha256.txt
          git rev-parse HEAD > opk-evidence/commit.txt
      - name: Upload OPK release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opk-stress-${{ github.sha }}
          path: opk-evidence/
          if-no-files-found: error
          retention-days: 90

  fuzz-host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build bounded host parser walker
        run: cargo build --locked --manifest-path fuzz/Cargo.toml --bin host_runner
      - name: Run 100k deterministic parser mutations
        run: cargo run --locked --manifest-path fuzz/Cargo.toml --bin host_runner -- 100000
