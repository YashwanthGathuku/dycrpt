name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  p0-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hardening/p0-audit-fixes-2026-08-22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/p0-audit-fixes-2026-08-22
      - name: Apply one-shot P0 engine hardening
        run: python tools/apply_p0_engine_hardening.py
      - name: Commit generated engine patch
        run: |
          if git diff --quiet -- src/engine/mod.rs; then
            echo "Engine patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/mod.rs
          git commit -m "fix: harden engine persistence and initiation replay"
          git push origin HEAD:hardening/p0-audit-fixes-2026-08-22

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features -- --skip ten_thousand

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --all-targets --all-features -- --skip ten_thousand

  fuzz-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path fuzz/Cargo.toml
      - run: cargo run --manifest-path fuzz/Cargo.toml --bin host_runner -- 5000
      # libfuzzer targets need: cargo build --manifest-path fuzz/Cargo.toml --features libfuzzer
      # (Linux only; Windows GNU cannot compile libfuzzer-sys)
