# cargo-mutants configuration.
#
# Mutation testing reruns the whole suite once per injected fault, so a single
# slow test dominates the total. Measured 2026-08-28: the debug-mode lib suite
# takes 539s, of which ~533s is the `ten_thousand` randomized handshake gate
# (11.7s in release, ~90x slower in debug). Excluding it takes a mutant cycle
# from ~10 minutes to ~1 minute.
#
# The gate is NOT disabled — it still runs in release via its own CI step. It is
# only skipped inside mutation runs, where its cost buys nothing: it exercises
# the same code paths the fast tests already cover, just more of them.
additional_cargo_test_args = ["--", "--skip", "ten_thousand"]

# Files with no meaningful behaviour to mutate.
exclude_globs = ["src/testing/**", "src/bin/**", "src/ffi/jni.rs"]

# `Drop` impls whose sole effect is zeroizing memory that is about to be freed.
#
# Mutating these to `()` is a real (if minor) regression — key material would
# not be wiped on drop — but it cannot be observed by any sound test: verifying
# it requires reading freed memory, which is undefined behaviour. Writing a UB
# test into a cryptography library to raise a score would be worse than the
# thing it measures.
#
# These are excluded rather than "killed". The behaviour they delegate to IS
# tested: `skipped_keys_zeroize_clears_the_store` asserts `SkippedKeys::zeroize`
# actually empties the store, so the only untested claim left is the one-line
# delegation from `drop` to `zeroize`.
#
# Reviewed 2026-08-28. Revisit if a drop-observability harness (tracking
# allocator, or a sentinel type) is ever added.
exclude_re = [
    "impl Drop for SkippedKeys",
    "impl Drop for SkippedMutationJournal",
]
